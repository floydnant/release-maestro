[mcp_servers.chrome-devtools]
command = "node"
args = [
    "./node_modules/chrome-devtools-mcp/build/src/bin/chrome-devtools-mcp.js",
    "--browserUrl",
    "http://127.0.0.1:9222",
    "--usageStatistics=false",
    "--memoryDebugging",
]

[mcp_servers.playwright]
enabled = false
command = "node"
args = [
    "./node_modules/@playwright/mcp/cli.js",
    "--cdp-endpoint",
    "http://127.0.0.1:9222",
]
