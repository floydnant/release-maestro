[mcp_servers.chrome-devtools]
command = "pnpm"
args = [
    "exec",
    "chrome-devtools-mcp",
    "--browserUrl",
    "http://127.0.0.1:9222",
    "--usageStatistics=false",
    "--memoryDebugging",
]

[mcp_servers.playwright]
enabled = false
command = "pnpm"
args = [
    "exec",
    "playwright-mcp",
    "--cdp-endpoint",
    "http://127.0.0.1:9222",
]
