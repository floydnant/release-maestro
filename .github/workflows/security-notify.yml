name: 'Security failure notification'

on:
    workflow_run:
        workflows:
            [
                'Security',
                'Security remediation',
                'Runtime security freshness',
                'Security automation health',
                'Release please',
                'Release',
            ]
        types: [completed]
    workflow_dispatch:

permissions: {}

jobs:
    notify:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.head_repository.full_name == github.repository &&
             (github.event.workflow_run.head_branch == 'main' ||
              (github.event.workflow_run.name == 'Release' && contains(fromJSON('["release", "workflow_dispatch"]'), github.event.workflow_run.event))) &&
             github.event.workflow_run.event != 'pull_request' &&
             contains(fromJSON('["failure", "timed_out", "cancelled", "action_required"]'), github.event.workflow_run.conclusion))
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            # Never check out or execute code/artifacts from the triggering workflow. Only send
            # metadata to the agent, which independently verifies it against GitHub before acting.
            - name: Notify T3 investigation agent
              env:
                  SECURITY_T3_WEBHOOK_URL: ${{ secrets.SECURITY_T3_WEBHOOK_URL }}
                  REPOSITORY: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
                  EVENT_NAME: ${{ github.event_name }}
              shell: bash
              run: |
                  if [ -z "$SECURITY_T3_WEBHOOK_URL" ]; then
                      echo '::error::SECURITY_T3_WEBHOOK_URL is missing. Security failure investigation is not connected.'
                      exit 1
                  fi
                  node <<'NODE'
                  const fs = require('node:fs');
                  const path = require('node:path');
                  const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
                  const fields = ['id', 'name', 'path', 'head_sha', 'head_branch', 'conclusion', 'html_url'];
                  const run = event.workflow_run;
                  const payload = {
                    repository: process.env.REPOSITORY,
                    notification_run_id: process.env.RUN_ID,
                    event: process.env.EVENT_NAME,
                    workflow_run: run ? Object.fromEntries(fields.map(key => [key, run[key] ?? null])) : null,
                  };
                  fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'security-notification.json'), JSON.stringify(payload));
                  NODE
                  curl --silent --output "$RUNNER_TEMP/security-notification-response" --fail --max-time 30 \
                    --retry 2 --retry-all-errors --header 'Content-Type: application/json' \
                    --data-binary "@$RUNNER_TEMP/security-notification.json" "$SECURITY_T3_WEBHOOK_URL" || {
                      echo '::error::T3 security notification delivery failed. Inspect this workflow and the daily health check.'
                      exit 1
                    }
                  echo 'Security investigation event delivered. Delivery does not establish remediation.' >> "$GITHUB_STEP_SUMMARY"
