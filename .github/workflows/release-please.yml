name: 'Release please'

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-please-main
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - name: Create release App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write

            # The App token lets bot-created PRs run CI and published releases start Release.
            - name: Update release PR
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  target-branch: main
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
                  skip-github-release: true

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: main
                  persist-credentials: false
            - uses: ./.github/actions/setup-node
              with:
                  install-command: pnpm install --frozen-lockfile --ignore-scripts
            - name: Check vulnerabilities before creating a release
              run: make security
            - name: Upload vulnerability report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: release-please-vulnerabilities
                  path: |
                      dist/security/osv.json
                      dist/security/findings.json
                  if-no-files-found: ignore
            - name: Require the scanned main revision to remain current
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  if [ "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" != "$(git rev-parse HEAD)" ]; then
                      echo "::error::main changed after its security scan. Retry on the current revision."
                      exit 1
                  fi
            - name: Create release after the full scan passes
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  target-branch: main
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
                  skip-github-pull-request: true
