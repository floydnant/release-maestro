name: 'Quality'

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

    workflow_dispatch:

permissions:
    contents: read

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-node

            - name: Check formatting
              run: make format-check

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-node

            - name: Check lint
              run: make lint

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-node

            - name: Run unit tests
              run: make test

    e2e:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-node

            # The e2e targets depend on maestro-e2e:typecheck, so tsc runs before Playwright does.
            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run production e2e tests
              uses: GabrielBB/xvfb-action@v1
              with:
                  run: make e2e-production

            - name: Run renderer e2e tests
              run: make e2e-renderer

            - name: Upload test report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-playwright-report-${{ runner.os }}
                  path: playwright-report
