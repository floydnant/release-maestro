name: 'Quality'

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

    workflow_dispatch:

permissions:
    contents: read

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node

            - name: Check formatting
              run: make format-check

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node

            - name: Check lint
              run: make lint

    agents:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node
              with:
                  install-command: pnpm install --frozen-lockfile --ignore-scripts

            # Structural only, so it runs on every pull request rather than a path-selected lane:
            # a skill rename must not slip through a docs-only change.
            - name: Check agent harness
              run: make agents-check

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node

            - name: Run unit tests
              run: make test

    dev-instance-self-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node

            - name: Install Electron system dependencies
              run: pnpm exec playwright install-deps chromium

            - name: Verify the development-instance manager
              uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465 # v1.7
              env:
                  ELECTRON_DISABLE_SANDBOX: '1'
              with:
                  run: make dev-instance-self-test

    e2e:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node

            - name: Verify Windows workflow descendants
              if: runner.os == 'Windows'
              run: make test-tools-windows

            # The e2e targets depend on maestro-e2e:typecheck, so tsc runs before Playwright does.
            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Run production e2e tests
              uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465 # v1.7
              with:
                  run: make e2e-production

            - name: Run renderer e2e tests
              run: make e2e-renderer

            - name: Upload test report
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: e2e-playwright-report-${{ runner.os }}
                  path: playwright-report
