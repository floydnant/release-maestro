name: 'Security'

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: '23 6 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    pr-dependencies:
        if: github.event_name == 'pull_request'
        name: Compare dependency vulnerabilities
        uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        permissions:
            actions: read
            contents: read
            security-events: write
        with:
            fail-on-vuln: true
            # Compare the lockfiles without executing package code or accepting repository suppressions.
            # /dev/null is an empty config available on the reusable workflow's Linux runner, including
            # on the base revision before this repository had security tooling.
            scan-args: |-
                --no-call-analysis
                --no-resolve
                --all-packages
                --all-vulns
                --config=/dev/null
                --lockfile=pnpm-lock.yaml
                --lockfile=apps/metadata-engine/Cargo.lock

    pr-gate:
        name: Dependency vulnerabilities
        needs: pr-dependencies
        if: always() && github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Require a successful comparison
              env:
                  SCAN_RESULT: ${{ needs.pr-dependencies.result }}
              run: test "$SCAN_RESULT" = success
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node
              with:
                  install-command: pnpm install --frozen-lockfile --ignore-scripts
            - name: Validate exception structure
              run: make security-policy-check
            # Release-please's combined PR branch for target-branch main.
            # Keep the full scan inside the required gate so release blockers prevent merging.
            - name: Check release readiness
              if: github.head_ref == 'release-please--branches--main'
              run: make security
            - name: Upload release readiness reports
              if: always() && github.head_ref == 'release-please--branches--main'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: release-pr-vulnerabilities
                  path: |
                      dist/security/osv.json
                      dist/security/findings.json
                  if-no-files-found: ignore

    dependencies:
        name: Full dependency vulnerabilities
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node
              with:
                  install-command: pnpm install --frozen-lockfile --ignore-scripts
            - name: Scan dependency vulnerabilities
              run: make security
            - name: Upload vulnerability reports
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: dependency-vulnerabilities
                  path: dist/security/*.json
                  if-no-files-found: ignore

    sbom:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node
              with:
                  install-command: pnpm install --frozen-lockfile --ignore-scripts
            - name: Fetch locked Rust crates
              run: cargo fetch --locked --manifest-path apps/metadata-engine/Cargo.toml
            - name: Generate dependency inventories
              run: make sbom
            - name: Upload source SBOMs
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: source-sbom
                  path: dist/security/
                  if-no-files-found: error

    submit-dependencies:
        name: Submit dependencies to Dependabot
        needs: sbom
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download dependency snapshot
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: source-sbom
                  path: snapshot
            - name: Update GitHub dependency graph
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: gh api --method POST "repos/$GH_REPO/dependency-graph/snapshots" --input snapshot/github-snapshot.json
