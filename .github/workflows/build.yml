name: 'Build'

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:
        inputs:
            release-sha:
                description: 'Immutable commit to package for a release.'
                type: string
                default: ''
            release-tag:
                description: 'Release tag whose version must match the app.'
                type: string
                default: ''

permissions:
    contents: read

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux
                    - os: macos-latest
                      platform: macos
                    - os: windows-latest
                      platform: windows
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.release-sha || github.sha }}
                  persist-credentials: false
            - uses: ./.github/actions/setup-node

            - name: Verify release version
              if: inputs.release-tag != ''
              env:
                  RELEASE_TAG: ${{ inputs.release-tag }}
              run: node tools/release.mjs verify

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf

            - name: Install production test dependencies
              if: inputs.release-tag != ''
              run: pnpm exec playwright install --with-deps chromium

            - name: Test the production app
              if: inputs.release-tag != ''
              uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465 # v1.7
              with:
                  run: make e2e-production

            - name: Upload failed production test report
              if: failure() && inputs.release-tag != ''
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: release-playwright-report-${{ matrix.platform }}
                  path: playwright-report
                  retention-days: 7

            - name: Build installers
              run: make package

            - name: Fetch locked SBOM dependencies
              run: cargo fetch --locked --manifest-path apps/metadata-engine/Cargo.toml

            - name: Generate release SBOMs
              run: make sbom-release

            - name: Upload release SBOMs
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: release-sbom-${{ matrix.platform }}
                  path: dist/security/
                  if-no-files-found: error

            - name: Collect installers
              env:
                  RELEASE_PLATFORM: ${{ matrix.platform }}
              run: node tools/release.mjs stage

            - name: Upload installers
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: installers-${{ matrix.platform }}
                  path: ${{ runner.temp }}/release-assets
                  if-no-files-found: error
                  retention-days: 7
