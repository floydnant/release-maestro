name: 'Build'

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node
            - name: Install linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf

            - name: Build the app
              run: make package

            - name: Fetch locked SBOM dependencies
              run: cargo fetch --locked --manifest-path apps/metadata-engine/Cargo.toml

            - name: Generate release SBOMs
              run: make sbom-release

            - name: Upload release SBOMs
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: release-sbom-linux
                  path: dist/security/
                  if-no-files-found: error

            # @TODO: add back in when we have a proper release pipeline
            # - name: Upload artifact
            #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            #   with:
            #       name: linux-build
            #       path: dist/executables/

    build-macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node

            - name: Build the app
              run: make package

            - name: Fetch locked SBOM dependencies
              run: cargo fetch --locked --manifest-path apps/metadata-engine/Cargo.toml

            - name: Generate release SBOMs
              run: make sbom-release

            - name: Upload release SBOMs
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: release-sbom-macos
                  path: dist/security/
                  if-no-files-found: error

            # @TODO: add back in when we have a proper release pipeline
            # - name: Upload artifact
            #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            #   with:
            #       name: macos-build
            #       path: dist/executables/*.dmg

    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-node

            - name: Build the app
              run: make package

            - name: Fetch locked SBOM dependencies
              run: cargo fetch --locked --manifest-path apps/metadata-engine/Cargo.toml

            - name: Generate release SBOMs
              run: make sbom-release

            - name: Upload release SBOMs
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: release-sbom-windows
                  path: dist/security/
                  if-no-files-found: error

            # @TODO: add back in when we have a proper release pipeline
            # - name: Upload artifact
            #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            #   with:
            #       name: windows-build
            #       path: dist/executables/
