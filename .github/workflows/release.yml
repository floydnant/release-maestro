name: 'Release'

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing published release tag to build or retry, for example v0.1.0.'
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: release-${{ github.event.release.tag_name || inputs.tag }}
    cancel-in-progress: false

jobs:
    resolve:
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.release.outputs.tag }}
            sha: ${{ steps.release.outputs.sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: main
                  fetch-depth: 0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: '.node-version'
            - name: Resolve published release
              id: release
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
                  GH_TOKEN: ${{ github.token }}
              run: node tools/release.mjs resolve

    build:
        needs: resolve
        uses: ./.github/workflows/build.yml
        with:
            release-sha: ${{ needs.resolve.outputs.sha }}
            release-tag: ${{ needs.resolve.outputs.tag }}

    publish:
        needs: [resolve, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ needs.resolve.outputs.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: '.node-version'
            - name: Download all platform installers
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: installers-*
                  merge-multiple: true
                  path: ${{ runner.temp }}/release-assets
            - name: Attach installers to the release
              env:
                  RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
                  GH_TOKEN: ${{ github.token }}
              run: node tools/release.mjs upload
