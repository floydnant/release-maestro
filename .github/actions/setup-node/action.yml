name: 'Setup Node dependencies'
description: 'Set up Node.js and install dependencies with the declared pnpm version.'

inputs:
    install-command:
        description: 'Command used to install dependencies.'
        required: false
        default: 'pnpm install --frozen-lockfile'

runs:
    using: 'composite'
    steps:
        - name: Setup node
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version-file: '.node-version'

        - name: Setup pnpm
          uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

        # Resolve without executing dependency code, then validate the repository policy before the
        # requested install is allowed to run lifecycle scripts.
        - name: Install policy dependencies
          shell: bash
          run: pnpm install --frozen-lockfile --ignore-scripts

        - name: Check dependency policy
          shell: bash
          run: make dependency-policy-check

        - name: Install dependencies
          shell: bash
          run: ${{ inputs.install-command }}
