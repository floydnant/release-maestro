name: 'Setup Node dependencies'
description: 'Set up Node.js and install the pinned pnpm dependencies.'

inputs:
    node-version:
        description: 'Node.js version to install.'
        required: false
        default: '22.22.3'
    install-command:
        description: 'Command used to install dependencies.'
        required: false
        default: 'pnpm install --frozen-lockfile'

runs:
    using: 'composite'
    steps:
        - name: Setup node
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
          with:
              node-version: ${{ inputs.node-version }}

        - name: Setup pnpm
          uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

        # Resolve without executing dependency code, then validate the repository policy before the
        # requested install is allowed to run lifecycle scripts.
        - name: Install policy dependencies
          shell: bash
          run: pnpm install --frozen-lockfile --ignore-scripts

        - name: Check dependency policy
          shell: bash
          run: make dependency-policy-check

        - name: Install dependencies
          shell: bash
          run: ${{ inputs.install-command }}
