name: 'Setup Node dependencies'
description: 'Set up Node.js and install the pinned pnpm dependencies.'

inputs:
    node-version:
        description: 'Node.js version to install.'
        required: false
        default: '22.22.3'
    install-command:
        description: 'Command used to install dependencies.'
        required: false
        default: 'pnpm install --frozen-lockfile'

runs:
    using: 'composite'
    steps:
        - name: Setup node
          uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v7
          with:
              node-version: ${{ inputs.node-version }}

        - name: Enable pinned pnpm
          shell: bash
          run: |
              mkdir -p .corepack
              corepack enable pnpm --install-directory .corepack
              echo "$GITHUB_WORKSPACE/.corepack" >> "$GITHUB_PATH"

        - name: Install dependencies
          shell: bash
          run: ${{ inputs.install-command }}
