<label class="type-label-sm text-content-muted" for="album-sort-field">Sort by</label>

<hlm-select [value]="sort().field" [itemToString]="optionLabel" (valueChange)="onFieldChange($event)">
    <hlm-select-trigger buttonId="album-sort-field" size="sm">
        <!-- Every label shares the value's grid cell, so the trigger is as wide as the longest
             option and the direction toggle beside it stays put when the field changes. -->
        <span class="grid justify-items-start">
            <hlm-select-value class="col-start-1 row-start-1" />
            @for (option of options; track option.field) {
                <span class="invisible col-start-1 row-start-1" aria-hidden="true">{{ option.label }}</span>
            }
        </span>
    </hlm-select-trigger>
    <hlm-select-content *hlmSelectPortal>
        @for (option of options; track option.field) {
            <hlm-select-item [value]="option.field">{{ option.label }}</hlm-select-item>
        }
    </hlm-select-content>
</hlm-select>

<button
    hlmBtn
    variant="ghost"
    size="icon-sm"
    type="button"
    [attr.aria-label]="directionLabel()"
    [hlmTooltip]="directionLabel()"
    (click)="directionToggle.emit()"
>
    <app-icon
        [name]="isAscending() ? 'sortOrderAscending' : 'sortOrderDescending'"
        size="16"
        color="content.primary"
    ></app-icon>
</button>
