<label hlmLabel class="type-label-sm text-content-muted" for="album-sort-field">Sort by</label>

<!-- Helm applies the value to its inner select after the projected options render.
     Keep the native label tied to the sort restored from the URL. -->
<hlm-native-select
    selectId="album-sort-field"
    selectClass="py-0.5 pe-2 appearance-auto"
    selectIconClass="hidden"
    [value]="sort().field"
    (valueChange)="onFieldChange($event)"
>
    @for (option of options; track option.field) {
        <option hlmNativeSelectOption [value]="option.field">
            {{ option.label }}
        </option>
    }
</hlm-native-select>

<button
    hlmBtn
    variant="ghost"
    type="button"
    class="gap-1 px-1.5"
    [attr.aria-label]="directionLabel()"
    [hlmTooltip]="directionLabel()"
    (click)="directionToggle.emit()"
>
    <app-icon
        [name]="isAscending() ? 'sortAscending' : 'sortDescending'"
        size="14"
        color="content.action"
    ></app-icon>
</button>
