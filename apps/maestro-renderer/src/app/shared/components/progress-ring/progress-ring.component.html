@if (mode === 'spinning') {
    <hlm-spinner
        [diameter]="diameter"
        [strokeWidth]="strokeWidth"
        [color]="color()"
        [bgColor]="bgColor()"
        [aria-label]="ariaLabel()"
    />
} @else {
    <svg
        role="progressbar"
        [attr.aria-label]="ariaLabel()"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="progress"
        [attr.height]="diameter"
        [attr.width]="diameter"
    >
        <circle
            class="progress-bg |"
            [attr.stroke-width]="strokeWidth"
            [attr.stroke]="bgColor()"
            fill="transparent"
            [attr.r]="radius"
            [attr.cx]="position"
            [attr.cy]="position"
        />
        <circle
            class="progress-ring"
            [attr.stroke-width]="strokeWidth"
            [attr.stroke]="color()"
            [attr.stroke-dasharray]="strokeDasharray"
            [attr.stroke-dashoffset]="offset"
            fill="transparent"
            [attr.r]="radius"
            [attr.cx]="position"
            [attr.cy]="position"
        />
    </svg>
}
