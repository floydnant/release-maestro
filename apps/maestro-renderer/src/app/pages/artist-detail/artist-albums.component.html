@if (result().status === 'error') {
    <div class="artist-albums__error | flex items-center justify-center gap-3 p-4" role="alert">
        <p class="artist-albums__error-message | type-body-sm text-content-secondary">
            Could not load albums for this artist
        </p>
        <button type="button" class="btn-neutral" (click)="onRetry()">Try again</button>
    </div>
}
@if (!result().loaded && result().status === 'loading') {
    <p class="artist-albums__loading | type-body-sm p-8 text-content-secondary" role="status">
        Loading albums…
    </p>
} @else if (result().loaded && result().total === 0) {
    <p class="artist-albums__empty | type-body-sm p-8 text-content-secondary">
        No albums linked to this artist
    </p>
} @else if (result().loaded) {
    <app-album-sort-bar
        [sort]="query().sort"
        (sortField)="onSort($event)"
        (directionToggle)="onSort(query().sort.field)"
    ></app-album-sort-bar>
    <app-album-grid
        [query]="query()"
        [result]="result()"
        [restoreScrollTop]="restoreScrollTop()"
        (viewportChange)="viewport.set($event)"
        (scrollRestored)="onScrollRestored()"
    ></app-album-grid>
}
