<app-browse-shell
    [state]="shellState()"
    [filters]="filters()"
    (searchChange)="onSearch($event)"
    (clearFilters)="onClear()"
    (retry)="onRetry()"
>
    <!-- A header row, not a lone sort control: the three numbers on every row are
         unlabelled without it, and the widths here are the ones `app-catalog-list`
         lays its cells out on. -->
    <div class="genre-sort | flex items-center gap-6 border-b border-border-subtle px-6">
        <button
            type="button"
            class="type-label-sm flex min-w-0 flex-1 items-center gap-1 py-2 text-content-primary"
            (click)="onSort()"
            [attr.aria-label]="query().sort.direction === 'asc' ? 'Sort genres Z to A' : 'Sort genres A to Z'"
        >
            Name
            <app-icon
                [name]="query().sort.direction === 'asc' ? 'octTriangleUp' : 'octTriangleDown'"
                size="12"
                color="content.action"
            ></app-icon>
        </button>
        <!-- Hidden from assistive tech: each cell below spells its own unit out, so
             announcing these too would read every row's counts twice. -->
        <span class="type-label-sm w-24 shrink-0 py-2 text-right text-content-muted" aria-hidden="true"
            >Tracks</span
        >
        <span class="type-label-sm w-24 shrink-0 py-2 text-right text-content-muted" aria-hidden="true"
            >Artists</span
        >
        <span class="type-label-sm w-24 shrink-0 py-2 text-right text-content-muted" aria-hidden="true"
            >Albums</span
        >
    </div>
    <app-catalog-list
        label="Genres"
        [result]="result()"
        [query]="query()"
        [showCounts]="true"
        [restoreScrollTop]="restoreScrollTop()"
        (viewportChange)="viewport.set($event)"
        (scrollRestored)="onScrollRestored()"
    ></app-catalog-list>
</app-browse-shell>
