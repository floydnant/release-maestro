<app-browse-shell
    [state]="shellState()"
    [filters]="filters()"
    (searchChange)="onSearch($event)"
    (clearFilters)="onClear()"
    (retry)="onRetry()"
>
    <div class="genre-sort | flex items-center border-b border-border-subtle px-6">
        <button
            type="button"
            class="type-label-sm flex items-center gap-1 py-2 text-content-primary"
            (click)="onSort()"
            [attr.aria-label]="query().sort.direction === 'asc' ? 'Sort genres Z to A' : 'Sort genres A to Z'"
        >
            Name
            <app-icon
                [name]="query().sort.direction === 'asc' ? 'octTriangleUp' : 'octTriangleDown'"
                size="12"
                color="content.action"
            ></app-icon>
        </button>
    </div>
    <app-catalog-list
        label="Genres"
        [result]="result()"
        [query]="query()"
        [showCounts]="true"
        [restoreScrollTop]="restoreScrollTop()"
        (viewportChange)="viewport.set($event)"
        (scrollRestored)="onScrollRestored()"
    ></app-catalog-list>
</app-browse-shell>
