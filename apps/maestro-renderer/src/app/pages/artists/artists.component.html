<app-browse-shell
    [state]="shellState()"
    [filters]="filters()"
    (searchChange)="onSearch($event)"
    (clearFilters)="onClear()"
    (retry)="onRetry()"
>
    <!-- Scroll the headings and rows together when the window is narrow. -->
    <div
        class="flex min-h-0 min-w-0 flex-1 flex-col overflow-x-auto"
        role="region"
        aria-label="Artist columns"
    >
        <div class="artist-sort | flex min-w-[35.5rem] items-center gap-6 border-b border-border-subtle px-6">
            <button
                type="button"
                class="artist-sort__name | type-label-sm flex min-w-0 flex-1 items-center gap-1 py-2 text-content-primary"
                (click)="onSort()"
                [attr.aria-label]="
                    query().sort.direction === 'asc' ? 'Sort artists Z to A' : 'Sort artists A to Z'
                "
            >
                Name
                <app-icon
                    [name]="query().sort.direction === 'asc' ? 'sortAscending' : 'sortDescending'"
                    size="12"
                    color="content.action"
                ></app-icon>
            </button>
            <!-- Hidden from assistive tech: each cell below spells its own unit out, so
             announcing these too would read every row's counts twice. -->
            <span
                class="artist-sort__tracks | type-label-sm w-24 shrink-0 py-2 text-right text-content-muted"
                aria-hidden="true"
                >Tracks</span
            >
            <span
                class="artist-sort__albums | type-label-sm w-24 shrink-0 py-2 text-right text-content-muted"
                aria-hidden="true"
                >Albums</span
            >
            <span
                class="artist-sort__years | type-label-sm w-24 shrink-0 py-2 text-right text-content-muted"
                aria-hidden="true"
                >Years active</span
            >
        </div>
        <app-catalog-list
            label="Artists"
            [style.min-width.px]="568"
            [result]="result()"
            [query]="query()"
            [restoreScrollTop]="restoreScrollTop()"
            (viewportChange)="viewport.set($event)"
            (scrollRestored)="onScrollRestored()"
        ></app-catalog-list>
    </div>
</app-browse-shell>
