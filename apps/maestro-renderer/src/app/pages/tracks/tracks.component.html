<app-browse-shell
    [state]="shellState()"
    [filters]="filterState()"
    (searchChange)="onSearch($event)"
    (presenceChange)="onPresence($event)"
    (chipRemove)="onChipRemove($event)"
    (clearFilters)="onClearFilters()"
    (retry)="onRetry()"
>
    <app-song-table
        [result]="result()"
        [sort]="query().sort"
        [selection]="selection()"
        (sortChange)="onSort($event)"
        (selectionChange)="onSelectionChange($event)"
        (viewportChange)="onViewportChange($event)"
        (entityFilter)="onEntityFilter($event)"
    ></app-song-table>
</app-browse-shell>
