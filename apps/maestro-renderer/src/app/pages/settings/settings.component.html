<div class="grid size-full min-h-0 grid-cols-[13rem_1fr] bg-background-canvas">
    <div class="border-r border-border-subtle bg-background-surface p-4">
        <p class="mb-3 type-label-sm text-content-muted">Music library</p>
        <ul class="mb-4">
            <li>
                <a
                    hlmBtn
                    variant="navigation"
                    routerLink="library"
                    routerLinkActive=""
                    ariaCurrentWhenActive="page"
                    class="settings-link | w-full"
                    >Library</a
                >
            </li>
        </ul>
        <p class="mb-3 type-label-sm text-content-muted">Import sources</p>
        <ul class="">
            <li>
                <a
                    hlmBtn
                    variant="navigation"
                    routerLink="apple-mail"
                    routerLinkActive=""
                    ariaCurrentWhenActive="page"
                    class="settings-link | w-full"
                    >Apple Mail</a
                >
            </li>
            <li>
                <a
                    hlmBtn
                    variant="navigation"
                    routerLink="debug"
                    routerLinkActive=""
                    ariaCurrentWhenActive="page"
                    class="settings-link | mt-px w-full"
                >
                    Debug
                </a>
            </li>
        </ul>
        @if (showDesignSystem) {
            <p class="mt-4 mb-3 type-label-sm text-content-muted">Development</p>
            <ul>
                <li>
                    <a
                        hlmBtn
                        variant="navigation"
                        routerLink="design-system"
                        routerLinkActive=""
                        ariaCurrentWhenActive="page"
                        class="settings-link | w-full"
                        >Design system</a
                    >
                </li>
            </ul>
        }
    </div>
    <div class="min-h-0 min-w-0 overflow-y-auto p-6">
        <router-outlet></router-outlet>
    </div>
</div>
