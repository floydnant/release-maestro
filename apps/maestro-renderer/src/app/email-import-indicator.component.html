<!-- Hides at once on the import route, without waiting out the phase's dwell -->
@if (hidden() ? null : activity(); as activity) {
    <p class="email-import-indicator | flex items-center gap-1 px-2 type-body-sm text-content-secondary">
        <app-progress-ring
            [mode]="activity.ring"
            [diameter]="25"
            [strokeWidth]="2.5"
            [color]="activity.color"
            bgColor="background.canvas"
            [progress]="activity.percent"
        ></app-progress-ring>
        {{ activity.label }}
        @if (activity.count) {
            <span class="font-mono">{{ activity.count }}</span>
        }
    </p>
    @if (isRunning()) {
        <button
            hlmBtn
            variant="ghost"
            size="icon-xs"
            class="email-import-cancel | self-center [-webkit-app-region:no-drag]"
            type="button"
            aria-label="Cancel email import"
            hlmTooltip="Cancel email import"
            (click)="cancelImport.emit($event)"
        >
            <app-icon name="close" size="14" aria-hidden="true"></app-icon>
        </button>
    }
}
<p class="email-import-summary | type-body-sm" role="status" aria-label="Email import" aria-live="polite">
    @if (hidden() ? null : summary(); as summary) {
        <!-- The spinner's 25px box draws an 18px ring. Match both dimensions. -->
        <span class="flex items-center gap-1 px-2" [class]="summaryClass()" [hlmTooltip]="summary.title">
            <app-icon
                class="size-[25px] shrink-0"
                [name]="summary.icon"
                [color]="summary.color"
                size="18"
            ></app-icon>
            {{ summary.text }}
        </span>
    }
</p>
